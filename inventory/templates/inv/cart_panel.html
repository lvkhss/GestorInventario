





{% load static %}

<!-- Slide-out Shopping Cart Panel (Only Slide Action and Buttons) -->
<button id="slideout-btn" style="position:fixed;top:1vh;right:1vh;z-index:2000;background:#354e66;color:white;border:none;padding:12px 18px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.12);cursor:pointer;transition:background 0.2s;">
  <div style="position:relative;display:inline-block;">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
    <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
  </svg>
    <span id="cart-counter" style="position:absolute;top:-8px;right:-8px;background:#e74c3c;color:white;border-radius:50%;min-width:18px;height:18px;font-size:11px;font-weight:bold;display:none;align-items:center;justify-content:center;line-height:1;padding:2px 4px;">0</span>
  </div>
</button>

<div id="slideout-panel" style="position:fixed;top:0;right:0;width:370px;max-width:95vw;height:100vh;background:#fff;border-left:4px solid #354e66;box-shadow:-4px 0 24px rgba(53,78,102,0.13);z-index:2100;transform:translateX(100%);transition:transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s linear 0.4s;padding:28px 18px 18px 18px;overflow-y:auto;visibility:hidden;">
  <button id="close-slideout" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:2.1rem;color:#354e66;cursor:pointer;line-height:1;">&times;</button>
  <h4 style="margin-top: 10px; color: #354e66; font-weight: 600;">PRODUCTOS</h4>
  <ul id="cart_items_list" style="list-style:none;padding:0;margin:18px 0 12px 0;"></ul>
  <div id="cart_total_amount" style="font-size:1.1em;font-weight:500;margin-bottom:18px;color:#354e66;">Total: $0</div>
  <div style="margin-bottom:14px;">
    <label for="cart-code-input" style="font-size:0.98em;color:#354e66;font-weight:500;">Código de documento (boleta, factura, guía, etc):</label>
    <input id="cart-code-input" type="text" maxlength="64" placeholder="Ingrese el código del documento" style="width:100%;padding:8px 10px;margin-top:4px;border:1px solid #bfc9d1;border-radius:4px;font-size:1em;">
  </div>
  <button id="cart-checkout-btn" style="width:100%;background:#354e66;color:white;border:none;padding:12px 0;border-radius:5px;font-size:1.1em;font-weight:600;cursor:pointer;">Finalizar compra</button>
  <div id="cart-empty-msg" style="display:none;color:#888;text-align:center;margin-top:20px;">El carrito está vacío.</div>
</div>
