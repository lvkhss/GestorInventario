<!-- Slide-out Shopping Cart Panel (Reusable Include) -->
<button id="slideout-btn" style="position:fixed;top:1vh;right:1vh;z-index:2000;background:#354e66;color:white;border:none;padding:12px 18px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.12);cursor:pointer;transition:background 0.2s;">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
  <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
</svg>
</button>

<div id="slideout-panel" style="position:fixed;top:0;right:0;width:400px;height:100vh;background:#f8fafc;box-shadow:-2px 0 12px rgba(0,0,0,0.12);z-index:2100;transform:translateX(100%);transition:transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s linear 0.4s; padding:32px 24px 24px 24px;overflow-y:auto;visibility:hidden;">
  <button id="close-slideout" style="position:absolute;top:18px;right:18px;background:none;border:none;font-size:2rem;color:#354e66;cursor:pointer;">&times;</button>
  <h3 style="color:#354e66;margin-bottom:1.5em;">Carrito de Compras</h3>
  <p>Aquí puedes mostrar los productos agregados al carrito, totales, y botones de acción.</p>
  <!-- Agrega aquí el contenido del carrito -->
</div>

<script>
  const btn = document.getElementById('slideout-btn');
  const panel = document.getElementById('slideout-panel');
  const closeBtn = document.getElementById('close-slideout');
  btn.addEventListener('click', function() {
    panel.style.transform = 'translateX(0)';
    panel.style.visibility = 'visible';
    panel.style.transition = 'transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s';
  });
  function hidePanel() {
    panel.style.transform = 'translateX(100%)';
    panel.style.transition = 'transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s linear 0.4s';
    setTimeout(function() {
      if (panel.style.transform === 'translateX(100%)') panel.style.visibility = 'hidden';
    }, 400);
  }
  closeBtn.addEventListener('click', hidePanel);
  document.addEventListener('mousedown', function(e) {
    if (panel.style.transform === 'translateX(0)' && !panel.contains(e.target) && e.target !== btn) {
      hidePanel();
    }
  });
</script>
