<!-- Slide-out Shopping Cart Panel (Reusable Include) -->
<button id="slideout-btn" style="position:fixed;top:1vh;right:1vh;z-index:2000;background:#354e66;color:white;border:none;padding:12px 18px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.12);cursor:pointer;transition:background 0.2s;">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
  <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
</svg>
</button>


<div id="slideout-panel" style="position:fixed;top:0;right:0;width:370px;max-width:95vw;height:100vh;background:#fff;border-left:4px solid #354e66;box-shadow:-4px 0 24px rgba(53,78,102,0.13);z-index:2100;transform:translateX(100%);transition:transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s linear 0.4s;padding:28px 18px 18px 18px;overflow-y:auto;visibility:hidden;">
  <button id="close-slideout" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:2.1rem;color:#354e66;cursor:pointer;line-height:1;">&times;</button>
  <h3 style="color:#354e66;font-weight:700;margin-bottom:1.1em;font-size:1.35em;letter-spacing:0.5px;">🛒 Carrito de Compras</h3>
  <div id="cart_items_table" style="margin-top:0.5em;background:#f4f7fa;border-radius:10px;padding:14px 10px 10px 10px;box-shadow:0 2px 8px rgba(53,78,102,0.06);min-height:120px;">
    <ul id="cart_items_list" style="list-style:none;padding:0;margin:0;"></ul>
    <div id="cart_total_amount" style="margin-top:1.2em;font-weight:700;color:#2a3a4d;text-align:right;font-size:1.13em;"></div>
  </div>
</div>

<script>
  // Cart panel open/close logic
  const btn = document.getElementById('slideout-btn');
  const panel = document.getElementById('slideout-panel');
  const closeBtn = document.getElementById('close-slideout');
  btn.addEventListener('click', function() {
    panel.style.transform = 'translateX(0)';
    panel.style.visibility = 'visible';
    panel.style.transition = 'transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s';
  });
  function hidePanel() {
    panel.style.transform = 'translateX(100%)';
    panel.style.transition = 'transform 0.4s cubic-bezier(.77,0,.18,1), visibility 0s linear 0.4s';
    setTimeout(function() {
      if (panel.style.transform === 'translateX(100%)') panel.style.visibility = 'hidden';
    }, 400);
  }
  closeBtn.addEventListener('click', hidePanel);
  document.addEventListener('mousedown', function(e) {
    if (panel.style.transform === 'translateX(0)' && !panel.contains(e.target) && e.target !== btn) {
      hidePanel();
    }
  });

  // Cart logic
  document.addEventListener('DOMContentLoaded', function() {
    const cartList = document.getElementById('cart_items_list');
    const totalDiv = document.getElementById('cart_total_amount');
    if (!panel || !cartList) return;
    // Cart data is stored in localStorage for persistence across pages
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('cart_items') || '{}');
      } catch { return {}; }
    }
    function setCart(cart) {
      localStorage.setItem('cart_items', JSON.stringify(cart));
    }
    function renderCart() {
      const cart = getCart();
      cartList.innerHTML = '';
      let total = 0;
      for (const [name, data] of Object.entries(cart)) {
        const li = document.createElement('li');
        li.style.display = 'flex';
        li.style.alignItems = 'center';
        li.style.justifyContent = 'space-between';
        li.style.padding = '7px 0 7px 0';
        li.style.borderBottom = '1px solid #e3e8ee';
        li.style.flexWrap = 'nowrap';
        li.style.overflow = 'hidden';
        li.style.textOverflow = 'ellipsis';
        // Quantity controls
        const minusBtn = document.createElement('button');
        minusBtn.textContent = '-';
        minusBtn.className = 'cart-qty-btn';
        minusBtn.setAttribute('data-qty-action', 'decrease');
        minusBtn.setAttribute('data-qty-name', name);
        minusBtn.style.background = '#e3e8ee';
        minusBtn.style.border = 'none';
        minusBtn.style.color = '#354e66';
        minusBtn.style.fontWeight = 'bold';
        minusBtn.style.fontSize = '1.1em';
        minusBtn.style.width = '28px';
        minusBtn.style.height = '28px';
        minusBtn.style.borderRadius = '50%';
        minusBtn.style.margin = '0 4px 0 10px';
        minusBtn.style.cursor = 'pointer';

        const plusBtn = document.createElement('button');
        plusBtn.textContent = '+';
        plusBtn.className = 'cart-qty-btn';
        plusBtn.setAttribute('data-qty-action', 'increase');
        plusBtn.setAttribute('data-qty-name', name);
        plusBtn.style.background = '#e3e8ee';
        plusBtn.style.border = 'none';
        plusBtn.style.color = '#354e66';
        plusBtn.style.fontWeight = 'bold';
        plusBtn.style.fontSize = '1.1em';
        plusBtn.style.width = '28px';
        plusBtn.style.height = '28px';
        plusBtn.style.borderRadius = '50%';
        plusBtn.style.margin = '0 0 0 4px';
        plusBtn.style.cursor = 'pointer';

        // Remove button (left side)
        const removeBtn = document.createElement('button');
        removeBtn.className = 'cart-remove-btn';
        removeBtn.setAttribute('data-remove-name', name);
        removeBtn.title = 'Quitar del carrito';
        removeBtn.style.background = 'none';
        removeBtn.style.border = 'none';
        removeBtn.style.color = '#c0392b';
        removeBtn.style.fontSize = '1.1em';
        removeBtn.style.marginRight = '7px';
        removeBtn.style.cursor = 'pointer';
        removeBtn.style.lineHeight = '1';
        removeBtn.style.padding = '0 4px';
        removeBtn.textContent = '×';
        // Name
        const nameSpan = document.createElement('span');
        nameSpan.style.fontWeight = '500';
        nameSpan.style.color = '#2a3a4d';
        nameSpan.style.whiteSpace = 'nowrap';
        nameSpan.style.overflow = 'hidden';
        nameSpan.style.textOverflow = 'ellipsis';
        nameSpan.style.maxWidth = '60%';
        nameSpan.style.display = 'inline-block';
        nameSpan.textContent = name;

        // Price/qty
        const priceSpan = document.createElement('span');
        priceSpan.style.color = '#354e66';
        priceSpan.style.fontWeight = '600';
        priceSpan.style.whiteSpace = 'nowrap';
        priceSpan.style.marginLeft = 'auto';
        priceSpan.innerHTML = `$${parseFloat(data.price).toLocaleString()} `;

        // Quantity controls wrapper
        const qtyWrap = document.createElement('span');
        qtyWrap.style.display = 'inline-flex';
        qtyWrap.style.alignItems = 'center';
        qtyWrap.appendChild(minusBtn);
        const qtyNum = document.createElement('span');
        qtyNum.textContent = data.quantity;
        qtyNum.style.margin = '0 4px';
        qtyNum.style.minWidth = '18px';
        qtyNum.style.textAlign = 'center';
        qtyNum.style.fontWeight = '600';
        qtyWrap.appendChild(qtyNum);
        qtyWrap.appendChild(plusBtn);

        li.appendChild(removeBtn);
        li.appendChild(nameSpan);
        li.appendChild(priceSpan);
        li.appendChild(qtyWrap);
        cartList.appendChild(li);
        cartList.appendChild(li);
        // Calculate total
        const priceNum = parseFloat(data.price);
        if (!isNaN(priceNum)) {
          total += priceNum * data.quantity;
        }
      }
      if (totalDiv) {
        totalDiv.innerHTML = `Total: <span style='color:#354e66;'>$${total.toLocaleString()}</span>`;
      }
    }
    // Delegate click events for cart-inv-btn (add to cart), cart-qty-btn (+/-), and cart-remove-btn (remove)
    document.body.addEventListener('click', function(e) {
      // Quantity controls
      const qtyBtn = e.target.closest('.cart-qty-btn');
      if (qtyBtn && qtyBtn.hasAttribute('data-qty-action') && qtyBtn.hasAttribute('data-qty-name')) {
        const action = qtyBtn.getAttribute('data-qty-action');
        const name = qtyBtn.getAttribute('data-qty-name');
        let cart = getCart();
        if (cart[name]) {
          let stockNum = cart[name].stock !== undefined && cart[name].stock !== null && cart[name].stock !== '' && cart[name].stock !== 'null' ? parseInt(cart[name].stock, 10) : null;
          if (action === 'increase') {
            if (stockNum === null || cart[name].quantity < stockNum) {
              cart[name].quantity += 1;
            }
          } else if (action === 'decrease') {
            if (cart[name].quantity > 1) {
              cart[name].quantity -= 1;
            }
          }
          setCart(cart);
          renderCart();
        }
        return;
      }
      // Remove from cart
      const removeBtn = e.target.closest('.cart-remove-btn');
      if (removeBtn && removeBtn.hasAttribute('data-remove-name')) {
        const name = removeBtn.getAttribute('data-remove-name');
        let cart = getCart();
        if (cart[name]) {
          delete cart[name];
          setCart(cart);
          renderCart();
        }
        return;
      }
      // Add to cart
      const btn = e.target.closest('.cart-inv-btn');
      if (btn && btn.hasAttribute('data-product-name')) {
        e.preventDefault();
        const name = btn.getAttribute('data-product-name');
        const price = btn.getAttribute('data-product-price');
        const stock = btn.getAttribute('data-product-stock');
        if (name && price) {
          const stockNum = stock !== undefined && stock !== null && stock !== '' ? parseInt(stock, 10) : null;
          let cart = getCart();
          if (cart[name]) {
            // Only increase if quantity < stock (if stock is defined)
            if (stockNum === null || cart[name].quantity < stockNum) {
              cart[name].quantity += 1;
            }
          } else {
            cart[name] = { price: price, quantity: 1, stock: stock };
          }
          setCart(cart);
          renderCart();
        }
      }
    });
    // Render cart on load (from localStorage)
    renderCart();
    // Also update cart when the panel is opened (in case another tab/page changed it)
    const slideoutBtn = document.getElementById('slideout-btn');
    if (slideoutBtn) {
      slideoutBtn.addEventListener('click', renderCart);
    }
    // Listen for storage events (other tabs)
    window.addEventListener('storage', function(e) {
      if (e.key === 'cart_items') renderCart();
    });
  });
</script>
