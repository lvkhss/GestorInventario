{% extends 'inv/base.html' %}

{% block body %}

<div class="add-product-container">
  <form method="POST" class="add-product-form">
    {% csrf_token %}

    <h4>Editar Producto</h4>
    {% for field in form %}
    <div class="add-product-group">
      <label for="id_{{ field.name }}" class="add-product-label">{{ field.label }}</label>
      <div class="add-product-field">
        {{ field }}
      </div>
    </div>
    
    {% endfor %}

   <div class="add-product-group">
  <label for="id_motivo" class="add-product-label">Motivo</label>
  <div class="add-product-field">
    <select name="motivo" id="id_motivo" class="form-control" required>
      <option value="" disabled selected>Seleccione un motivo</option>
      <option value="Venta">Venta</option>
      <option value="Corrección nombre">Corrección nombre</option>
      <option value="Corrección precio">Corrección precio</option>
      <option value="Ajuste de inventario">Ajuste de inventario</option>
      <option value="Uso interno">Uso interno</option>
      <option value="Otro">Otro</option>
    </select>
    <input type="text" id="motivo_extra" class="form-control" placeholder="Añadir motivo" style="margin-top:8px;" disabled>
  </div>
</div>
    <input type="hidden" name="motivo" id="motivo_hidden">
    <div class="add-product-group">
      <div class="add-product-btn-wrap">
        <button type="button" class="add-product-btn" onclick="window.location.href='{% url "inventario" %}'">Volver </button>
        <button type="submit" class="add-product-btn">Guardar Cambios</button>
      </div>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const motivoSelect = document.getElementById('id_motivo');
  const motivoExtra = document.getElementById('motivo_extra');
  const motivoHidden = document.getElementById('motivo_hidden');
  const form = document.querySelector('form');

  motivoSelect.addEventListener('change', function() {
    if (motivoSelect.value !== "Otro") {
      motivoExtra.disabled = true;
      motivoExtra.value = "";
    } else {
      motivoExtra.disabled = false;
      motivoExtra.value = "";
      motivoExtra.focus();
    }
  });

  form.addEventListener('submit', function(e) {
    if (motivoSelect.value === "Otro") {
      motivoHidden.value = motivoExtra.value;
    } else {
      motivoHidden.value = motivoSelect.value;
    }
  });
});
</script>
{% endblock %}
