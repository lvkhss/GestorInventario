{% extends 'inv/base.html' %}

{% load static %}

{% block body %}
<h2>Historial de movimientos</h2>
<div class="container-set-inventory">
  <div class="add_buttons">
    <div class="inventory-left">
      <div class="button-group">
        <input type="text" id="searchInput" name="q" placeholder="Buscar..." class="form-control" value="{{ current_query }}" />
      </div>

      <div class="button-group">
        <select id="filterType" class="form-select" name="type" onchange="updateHistorialTable()">
          <option value="">Todos</option>
          {% for product_type in product_types %}
          <option value="{{ product_type }}" {% if product_type == current_type %}selected{% endif %}>{{ product_type }}</option>
          {% endfor %}
        </select>
        <select id="filterMotivo" class="form-select" name="motivo" onchange="updateHistorialTable()" >
          <option value="">Motivo</option>
          {% for motivo in motivos %}
          <option value="{{ motivo }}" {% if motivo == current_motivo %}selected{% endif %}>{{ motivo }}</option>
          {% endfor %}
        </select>
        {% if user.is_staff %}
        <select id="filterUser" class="form-select" name="user" onchange="updateHistorialTable()">
          <option value="">Usuarios</option>
          {% for usuario in users %}
          <option value="{{ usuario.username }}" {% if usuario.username == current_user %}selected{% endif %}>{{ usuario.username }}</option>
          {% endfor %}
        </select>
        {% endif %}
        <button type="submit" class="dynamic-table-button"></button>
        <button type="button" class="dynamic-table-button" id="showCartSalesBtn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
            <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="button-group-2">
      <label for="startDate">Desde:</label>
      <input type="date" id="startDate" class="form-control">
      <label for="endDate">Hasta:</label>
      <input type="date" id="endDate" class="form-control">
    </div>
  </div>
</div>


<div id="tablaHistorial">
  {% include 'inv/tabla_historial.html' %}
</div>
<script src="{% static 'js/main.js' %}"></script>
{% include 'inv/cart_panel.html' %}
{% endblock %}
