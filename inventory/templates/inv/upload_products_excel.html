{% extends 'inv/base.html' %}
{% block body %}
<h2>Subir productos desde Excel</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="button" class="add-product-btn" onclick="window.location.href='{% url 'inventario' %}'">Volver</button>
  <button type="submit">Subir</button>
</form>
{% if msg %}
  <p>{{ msg }}</p>
{% endif %}
{% endblock %}
