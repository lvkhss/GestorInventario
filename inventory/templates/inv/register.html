{% extends 'inv/base.html' %}
{% load static %}
{% block body %}
<div class="container-login" style="max-width: 400px; margin-top: 60px;">
  {% if error %}
  <div class="alert alert-danger" role="alert">
    {{ error }}
  </div>
  {% endif %}

  <form class="form-register" method="POST">
    {% csrf_token %}
    <div class="form-group mb-3">
      
      <label for="id_username">Usuario</label>
      <input type="text" class="form-control" id="id_username" name="username" required>
    </div>
    <div class="form-group mb-3">
      <label for="id_email">Email</label>
      <input type="email" class="form-control" id="id_email" name="email" required>
    </div>
    <div class="form-group mb-3">
      <label for="id_password1">Contraseña</label>
      <div class="input-group">
        <input type="password" class="form-control" id="id_password1" name="password1" required>
        <span class="input-group-text" id="copyBtn" onclick="copyPassword()" title="Copiar contraseña">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-file-earmark-text" viewBox="0 0 16 16">
            <path
              d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
            <path
              d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" />
          </svg>
        </span>
        <span class="input-group-text2" id="togglePassword" onclick="togglePasswordVisibility()"
          title="Mostrar/Ocultar contraseña" style="cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye"
            viewBox="0 0 16 16">
            <path
              d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
          </svg>
        </span>
      </div>
    </div>
    <div class="form-group mb-3">
      <label for="id_password2">Confirmar Contraseña</label>
      <input type="password" class="form-control" id="id_password2" name="password2" required>
    </div>
    <button type="button" class="btn btn-primary w-100" onclick="enablePassword()">Generar Contraseña</button>
    <button type="submit" class="btn btn-primary w-100">Registrar</button>
<button type="button" class="btn btn-primary w-100" onclick="window.location.href='{% url 'users' %}'">Volver</button>
  </form>

</div>


<!-- Toast flotante -->
<div id="copyToast"
  style="position: fixed; top: 20px; right: 20px; z-index: 1050; background-color: #28a745; color: white; padding: 10px 15px; border-radius: 5px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  ✓ Contraseña copiada
</div>

<!-- Toast flotante para usuario creado -->
<div id="successToast"
  style="position: fixed; top: 20px; right: 20px; z-index: 1050; background-color: #28a745; color: white; padding: 10px 15px; border-radius: 5px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  ✓ Usuario creado exitosamente
</div>


<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
