{% extends 'inv/base.html' %}
{% load static %}
{% block body %}
<div class="registro-container">
  {% if error %}
  <div class="registro-alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div>
      <label for="first_name" class="registro-form-label">Nombre</label>
      <input type="text" class="registro-form-control" id="first_name" name="first_name" required>
    </div>
    <!-- Apellido -->
    <div>
      <label for="last_name" class="registro-form-label">Apellido</label>
      <input type="text" class="registro-form-control" id="last_name" name="last_name" required>
    </div>
    <!-- Username -->
    <div>
      <label for="id_user" class="registro-form-label">Usuario</label>
      <input type="text" class="registro-form-control" id="id_user" name="username" required>
    </div>

    <!-- Email -->
    <div>
      <label for="id_email" class="registro-form-label">Correo Electrónico</label>
      <input type="email" class="registro-form-control" id="id_email" name="email" required>
    </div>

    <!-- Password -->
    <div>
      <label for="id_password" class="registro-form-label">Contraseña</label>
      <div class="registro-input-group" style="display: flex; align-items: center;">
        <input type="password" class="registro-form-control" id="id_password" name="password1" required style="flex:1;">
        <div class="registro-input-group-icons" style="display: flex; gap: 4px; margin-left: 6px;">
          <span class="registro-input-btn2" id="togglePassword" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar contraseña" style="cursor:pointer; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye"
              viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
              
            </svg>
          </span>
          <span class="registro-input-btn" id="copyBtn" onclick="copyPassword()" title="Copiar contraseña" style="cursor:pointer; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
              class="bi bi-file-earmark-text" viewBox="0 0 16 16">
              <path d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
              <path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" />
            </svg>
          </span>
        </div>
      </div>
</div>

<!-- Confirm Password -->
<div>
  <label for="id_confirm_password" class="registro-form-label">Confirmar Contraseña</label>
  <input type="password" class="registro-form-control" id="id_confirm_password" name="password2" required>
</div>
{% if user.is_staff %}
  <div class="add-product-group">
    <label class="add-product-label">Permisos</label>
    <div class="add-product-field">
      <div class="form-check">
        <label for="is_staff" class="form-check-label">
          Staff 
        </label> 
        <input type="checkbox" 
               id="is_staff" 
               name="is_staff" 
               class="form-check-input"
               {% if request.POST.is_staff %}checked{% elif user_obj.is_staff %}checked{% endif %}>
      </div>
      
      <div class="form-check mt-2">
        <label for="is_superuser" class="form-check-label">
          Superusuario 
        </label>
        <input type="checkbox" 
               id="is_superuser" 
               name="is_superuser" 
               class="form-check-input"
               {% if request.POST.is_superuser %}checked{% elif user_obj.is_superuser %}checked{% endif %}>
      </div>
    </div>
  </div>
{% endif %}
<button type="button" class="registro-btn" onclick="enablePassword()">Generar Contraseña</button>
<button type="submit" class="registro-btn">Registrar</button>
<button type="button" class="registro-btn" onclick="window.location.href='{% url 'users_view' %}'">Volver</button>
</form>

</div>

<!-- Toast Messages -->
<div class="registro-toast copy">✓ Contraseña copiada</div>
<div class="registro-toast">✓ Usuario creado exitosamente</div>

<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
