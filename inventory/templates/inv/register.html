{% extends 'inv/base.html' %}

{% block body %}
<div class="container-login" style="max-width: 400px; margin-top: 60px;">
  {% if error %}
  <div class="alert alert-danger" role="alert">
      {{ error }}
  </div>
  {% endif %}
  
  <form method="POST">
    {% csrf_token %}
    <div class="form-group mb-3">
      <label for="id_username">Usuario</label>
      <input type="text" class="form-control" id="id_username" name="username" required>
    </div>
    <div class="form-group mb-3">
      <label for="id_email">Email</label>
      <input type="email" class="form-control" id="id_email" name="email" required>
    </div>
    <div class="form-group mb-3">
      <label for="id_password1">Contraseña</label>
      <div class="input-group">
        <input type="password" class="form-control" id="id_password1" name="password1" required>
        <span class="input-group-text" id="copyBtn" onclick="copyPassword()" title="Copiar contraseña">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            class="bi bi-file-earmark-text" viewBox="0 0 16 16">
            <path
              d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
            <path
              d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" />
          </svg>
        </span>
        <span class="input-group-text2" id="togglePassword" onclick="togglePasswordVisibility()"
          title="Mostrar/Ocultar contraseña" style="cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye"
            viewBox="0 0 16 16">
            <path
              d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
          </svg>
        </span>
      </div>
    </div>
    <div class="form-group mb-3">
      <label for="id_password2">Confirmar Contraseña</label>
      <input type="password" class="form-control" id="id_password2" name="password2" required>
    </div>
    <button type="button" class="btn btn-primary w-100 mb-3" onclick="enablePassword()">Generar Contraseña</button>
    <button type="submit" class="btn btn-primary w-100">Registrar</button>
  </form>

</div>


<!-- Toast flotante -->
<div id="copyToast"
  style="position: fixed; top: 20px; right: 20px; z-index: 1050; background-color: #28a745; color: white; padding: 10px 15px; border-radius: 5px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  ✓ Contraseña copiada
</div>

<!-- Toast flotante para usuario creado -->
<div id="successToast"
  style="position: fixed; top: 20px; right: 20px; z-index: 1050; background-color: #28a745; color: white; padding: 10px 15px; border-radius: 5px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  ✓ Usuario creado exitosamente
</div>

<script>
  function enablePassword() {
    const passwordField = document.getElementById('id_password1');
    const copyBtn = document.getElementById('copyBtn');

    // Generar contraseña automáticamente
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
    let password = '';
    for (let i = 0; i < 12; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    passwordField.value = password;
}

  function copyPassword() {
    const passwordField = document.getElementById('id_password1');
    if (passwordField.value) {
      passwordField.select();
      document.execCommand('copy');

      // Mostrar toast flotante
      const toast = document.getElementById('copyToast');
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }
  }

  function togglePasswordVisibility() {
    const passwordField = document.getElementById('id_password1');
    const toggleBtn = document.getElementById('togglePassword');

    if (passwordField.type === 'password') {
      passwordField.type = 'text';
      toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16">
          <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
          <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
          <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
        </svg>`;
      toggleBtn.title = 'Ocultar contraseña';
    } else {
      passwordField.type = 'password';
      toggleBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
          <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
          <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
        </svg>`;
      toggleBtn.title = 'Mostrar contraseña';
    }
  }

  // Agregar validación antes del envío
  document.querySelector('form').addEventListener('submit', function(e) {
    console.log('Form submit event triggered'); // Nueva línea de debug
    
    const username = document.getElementById('id_username').value;
    const email = document.getElementById('id_email').value;
    const password1 = document.getElementById('id_password1').value;
    const password2 = document.getElementById('id_password2').value;
    
    console.log('Datos del formulario:', {
        username: username,
        email: email,
        password1: password1 ? 'tiene valor' : 'vacío',
        password2: password2 ? 'tiene valor' : 'vacío'
    });
    
    // Verificar que todos los campos estén llenos
    if (!username || !email || !password1 || !password2) {
        e.preventDefault();
        alert('Por favor complete todos los campos');
        return false;
    }
    
    // Verificar que las contraseñas coincidan
    if (password1 !== password2) {
        e.preventDefault();
        alert('Las contraseñas no coinciden');
        return false;
    }
    
    console.log('Formulario válido, enviando...');
    // No uses e.preventDefault() aquí para que el formulario se envíe
});

  // Mostrar toast de éxito si hay mensaje
  {% if success_message %}
  document.addEventListener('DOMContentLoaded', function() {
      const toast = document.getElementById('successToast');
      toast.style.display = 'block';
      setTimeout(() => {
          toast.style.display = 'none';
      }, 3000);
  });
  {% endif %}

</script>

{% endblock %}
